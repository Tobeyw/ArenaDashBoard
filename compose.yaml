services:
  dashboard:
    image: arena-dashboard:local

    build:
      context: .

    restart: unless-stopped
    network_mode: host

    env_file:
      - ${DASHBOARD_ENV_FILE:-.env}

    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "4310"

    read_only: true

    tmpfs:
      - /tmp:size=16m,mode=1777

    cap_drop:
      - ALL

    stop_grace_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"